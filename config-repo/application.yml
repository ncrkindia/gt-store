# Global Configuration for all Microservices
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/gtstore_db}
    username: ${SPRING_DATASOURCE_USERNAME:gtstore}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
  cloud:
    bus:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://pahchaan.slpro.in/realms/e-pahchaan}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://pahchaan.slpro.in/realms/e-pahchaan/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh,bus-refresh,busrefresh
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:4012/api/v2/spans}

# Common Gateway URL
gateway:
  public-url: ${GATEWAY_PUBLIC_URL:https://gts-api.slpro.in}

platform:
  web-url: ${PLATFORM_WEB_URL:https://gtstore.slpro.in}

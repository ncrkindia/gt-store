# API Gateway Routing Rules
spring:
  cloud:
    gateway:
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET
      routes:
        - id: user-service
          uri: http://user-service:4004
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: http://product-service:4005
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/banners/**
        - id: cart-service
          uri: http://cart-service:4006
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: http://order-service:4007
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: http://inventory-service:4008
          predicates:
            - Path=/api/inventory/**
        - id: payment-service
          uri: http://payment-service:4009
          predicates:
            - Path=/api/payments/**
        - id: search-service
          uri: http://search-service:4011
          predicates:
            - Path=/api/search/**
        - id: media-service
          uri: http://media-service:4010
          predicates:
            - Path=/api/media/**
        - id: shipping-service
          uri: http://shipping-service:4016
          predicates:
            - Path=/api/shipping/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /api/users/v3/api-docs
      - name: Product Service
        url: /api/products/v3/api-docs
      - name: Cart Service
        url: /api/cart/v3/api-docs
      - name: Order Service
        url: /api/orders/v3/api-docs
      - name: Inventory Service
        url: /api/inventory/v3/api-docs
      - name: Payment Service
        url: /api/payments/v3/api-docs
      - name: Search Service
        url: /api/search/v3/api-docs
      - name: Shipping Service
        url: /api/shipping/v3/api-docs

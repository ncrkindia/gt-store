<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<body>
    <div>
        <div class="order-badge" th:text="'ORDER #' + ${orderId}">ORDER #12345</div>
        <h2 style="font-weight: 800; margin-top: 0; color: #1e293b;">Payment Successful!</h2>
        <p>Hello <span th:text="${fullName != null ? fullName : 'Customer'}" style="font-weight: 700;">Customer</span>,</p>
        <p style="color: #475569;">Great news! We have successfully received your payment. Our team is now picking and packing your items for shipment.</p>
        
        <div style="background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 16px; padding: 24px; margin: 24px 0;">
            <p style="margin: 0; font-size: 13px; color: #166534; font-weight: 600; text-transform: uppercase;">Payment Status</p>
            <div style="margin-top: 8px;">
                <span class="status-pill status-success">Paid & Processing</span>
            </div>
        </div>

        <a href="#" class="btn">Track Progress</a>
    </div>
</body>
</html>

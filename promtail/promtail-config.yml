server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'

  - job_name: kafka
    kafka:
      brokers: [kafka:29092]
      topics: 
        - order.created
        - order.paid
        - order.shipped
        - order.cancelled
        - order.failed
        - support.request
        - product.sync
      group_id: promtail-gt-store
    relabel_configs:
      - source_labels: [__meta_kafka_topic]
        target_label: topic
      - source_labels: [topic]
        target_label: job
        replacement: kafka-topic

    pipeline_stages:
      - json:
          expressions:
            event:
            orderId:
            status:
            customer:
            message:
      - labels:
          event:
          orderId:
          status:

server:
  port: 4009
  forward-headers-strategy: native


spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://postgres:5432/gtstore_db
    username: gtstore
    password: password
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

logging:
  level:
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:4012/api/v2/spans

springdoc:
  api-docs:
    path: /api/payments/v3/api-docs
    servers:
      - url: https://gts-api.slpro.in
        description: GT Store API Gateway
  swagger-ui:
    enabled: true





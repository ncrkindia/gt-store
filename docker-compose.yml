# GT Store Microservices Platform - Docker Compose
# Defines the full-stack infrastructure including databases, auth, messaging, and application services.
services:
  # ----------------------------------------------------------------------------
  # Centralized Identity & Access Management
  # ----------------------------------------------------------------------------
  # keycloak:
  #   image: quay.io/keycloak/keycloak:24.0.1
  #   container_name: gt-store-keycloak
  #   environment:
  #     KC_DB: dev-file
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #     KC_FEATURES: scripts
  #     KC_HTTP_PORT: 8080
  #   command:
  #     - start-dev
  #     - --import-realm
  #   volumes:
  #     - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - gt-store-network

  # ----------------------------------------------------------------------------
  # Relational Database for Order, User, Inventory Services
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: gt-store-postgres
    environment:
      POSTGRES_USER: gtstore
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gtstore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Document Database for Product Catalog
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: gt-store-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: gtstore_catalog
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Cache & Cart Storage
  # ----------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: gt-store-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - gt-store-network

  # ----------------------------------------------------------------------------
  # Message Broker for Async Events
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: gt-store-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gt-store-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: gt-store-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Search & Analytics Engine (Phase 3)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gt-store-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Local SMTP for Email Notifications
  # ----------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gt-store-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "4001:8025" # Web UI
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Application Microservices
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: gt-store-api-gateway
    ports:
      - "4003:4003"
    # depends_on:
    #   - keycloak
    networks:
      - gt-store-network

  user-service:
    build:
      context: ./user-service
    container_name: gt-store-user-service
    depends_on:
      - postgres
      # - keycloak
    networks:
      - gt-store-network

  product-service:
    build:
      context: ./product-service
    container_name: gt-store-product-service
    depends_on:
      - mongodb
      # - keycloak
    networks:
      - gt-store-network

  cart-service:
    build:
      context: ./cart-service
    container_name: gt-store-cart-service
    # depends_on:
    #   - redis
    networks:
      - gt-store-network
    environment:
      - REDIS_PASSWORD=khojo_redis_password # Override this with your external Redis password
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    build:
      context: ./order-service
    container_name: gt-store-order-service
    ports:
      - "4007:4007"
    depends_on:
      - postgres
      - kafka
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Web Frontend
  # ----------------------------------------------------------------------------
  gt-store-web:
    build:
      context: ./gt-store-web
    container_name: gt-store-web
    ports:
      - "4000:80"
    depends_on:
      - api-gateway
    networks:
      - gt-store-network

  gt-store-admin-web:
    build:
      context: ./gt-store-admin-web
    container_name: gt-store-admin-web
    ports:
      - "4002:80"
    depends_on:
      - api-gateway
    networks:
      - gt-store-network

  inventory-service:
    build:
      context: ./inventory-service
    container_name: gt-store-inventory-service
    ports:
      - "4008:4008"
    depends_on:
      - postgres
      - kafka
    networks:
      - gt-store-network

  payment-service:
    build:
      context: ./payment-service
    container_name: gt-store-payment-service
    ports:
      - "4009:4009"
    depends_on:
      - postgres
      - kafka
    networks:
      - gt-store-network

  search-service:
    build:
      context: ./search-service
    container_name: gt-store-search-service
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - gt-store-network

  notification-service:
    build:
      context: ./notification-service
    container_name: gt-store-notification-service
    depends_on:
      - kafka
      - mailhog
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Observability & Tracing (Phase 3)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: gt-store-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gt-store-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: gt-store-zipkin
    ports:
      - "4012:9411"
    networks:
      - gt-store-network

  grafana:
    image: grafana/grafana:latest
    container_name: gt-store-grafana
    ports:
      - "4013:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - gt-store-network
  # ----------------------------------------------------------------------------
  # Production Reverse Proxy (Phase 3)
  # # ----------------------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: gt-store-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/certs:/etc/nginx/certs
  #   depends_on:
  #     - api-gateway
  #     - gt-store-web
  #     - gt-store-admin-web
  #   networks:
  #     - gt-store-network

networks:
  gt-store-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: # redis_data:

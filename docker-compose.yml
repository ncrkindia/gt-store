# GT Store Microservices Platform - Docker Compose
# Defines the full-stack infrastructure including databases, auth, messaging, and application services.
services:
  # ----------------------------------------------------------------------------
  # Centralized Identity & Access Management
  # ----------------------------------------------------------------------------
  # keycloak:
  #   image: quay.io/keycloak/keycloak:24.0.1
  #   container_name: gt-store-keycloak
  #   environment:
  #     KC_DB: dev-file
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #     KC_FEATURES: scripts
  #     KC_HTTP_PORT: 8080
  #   command:
  #     - start-dev
  #     - --import-realm
  #   volumes:
  #     - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - gt-store-network

  # ----------------------------------------------------------------------------
  # Relational Database for Order, User, Inventory Services
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: gt-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Document Database for Product Catalog
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: gt-store-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Cache & Cart Storage
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gt-store-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Message Broker for Async Events
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: gt-store-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - gtstore_zookeeper_data:/var/lib/zookeeper/data
      - gtstore_zookeeper_log:/var/lib/zookeeper/log
    networks:
      - gt-store-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: gt-store-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - gtstore_kafka_data:/var/lib/kafka/data
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Search & Analytics Engine (Phase 3)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gt-store-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - gtstore_elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Secret & Key Management
  # ----------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:latest
    container_name: gt-store-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      NOTIFICATION_CC: ${NOTIFICATION_CC}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/data:/vault/data
      - ./vault/scripts:/vault/scripts:ro
    command: sh /vault/scripts/init-vault.sh
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Centralized Configuration Management
  # ----------------------------------------------------------------------------
  config-server:
    build:
      context: ./config-server
    container_name: gt-store-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config
    environment:
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_VAULT_ENABLED=true
      - SPRING_CLOUD_VAULT_HOST=vault
      - SPRING_CLOUD_VAULT_PORT=8200
      - SPRING_CLOUD_VAULT_SCHEME=http
      - SPRING_CLOUD_VAULT_AUTHENTICATION=approle
      - SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID=${VAULT_ROLE_ID}
      - SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID=${VAULT_SECRET_ID}
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_HOST=vault
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_PORT=8200
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_SCHEME=http
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_AUTHENTICATION=approle
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_APP_ROLE_ROLE_ID=${VAULT_ROLE_ID}
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_APP_ROLE_SECRET_ID=${VAULT_SECRET_ID}
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_TOKEN_DIRECT_FORWARD=false
      - SPRING_CLOUD_CONFIG_SERVER_VAULT_KV_VERSION=2
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_CONFIG_SERVER_VAULT=TRACE
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - gt-store-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Application Microservices
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: gt-store-api-gateway
    restart: unless-stopped
    ports:
      - "4003:4003"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  user-service:
    build:
      context: ./user-service
    container_name: gt-store-user-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  product-service:
    build:
      context: ./product-service
    container_name: gt-store-product-service
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
    networks:
      - gt-store-network

  cart-service:
    build:
      context: ./cart-service
    container_name: gt-store-cart-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gt-store-network

  order-service:
    build:
      context: ./order-service
    container_name: gt-store-order-service
    restart: unless-stopped
    ports:
      - "4007:4007"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Web Frontend
  # ----------------------------------------------------------------------------
  gt-store-web:
    build:
      context: ./gt-store-web
    container_name: gt-store-web
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - api-gateway
    networks:
      - gt-store-network

  gt-store-admin-web:
    build:
      context: ./gt-store-admin-web
    container_name: gt-store-admin-web
    restart: unless-stopped
    ports:
      - "4002:80"
    depends_on:
      - api-gateway
    networks:
      - gt-store-network

  inventory-service:
    build:
      context: ./inventory-service
    container_name: gt-store-inventory-service
    restart: unless-stopped
    ports:
      - "4008:4008"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  payment-service:
    build:
      context: ./payment-service
    container_name: gt-store-payment-service
    restart: unless-stopped
    ports:
      - "4009:4009"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    networks:
      - gt-store-network

  search-service:
    build:
      context: ./search-service
    container_name: gt-store-search-service
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  media-service:
    build:
      context: ./media-service
    container_name: gt-store-media-service
    restart: unless-stopped
    ports:
      - "4010:4010"
    volumes:
      - media_data:/app/media
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
    networks:
      - gt-store-network

  notification-service:
    build:
      context: ./notification-service
    container_name: gt-store-notification-service
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - SPRING_MAIL_HOST=${SMTP_HOST}
      - SPRING_MAIL_PORT=${SMTP_PORT}
      - SPRING_MAIL_USERNAME=${SMTP_USERNAME}
      - SPRING_MAIL_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_CC=${NOTIFICATION_CC}
    networks:
      - gt-store-network

  # shipping-service:
  #   build:
  #     context: ./shipping-service
  #   container_name: gt-store-shipping-service
  #   restart: unless-stopped
  #   ports:
  #     - "4016:4016"
  #   depends_on:
  #     config-server:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_started
  #   environment:
  #     - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
  #     - SPRING_DATASOURCE_URL=${POSTGRES_URL}?currentSchema=shipping
  #     - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
  #     - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
  #     - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
  #     - SHIPROCKET_EMAIL=${SHIPROCKET_EMAIL}
  #     - SHIPROCKET_PASSWORD=${SHIPROCKET_PASSWORD}
  #     - SHIPROCKET_PICKUP_LOCATION=${SHIPROCKET_PICKUP_LOCATION}
  #     - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
  #   networks:
  #     - gt-store-network

  invoice-service:
    build:
      context: ./invoice-service
    container_name: gt-store-invoice-service
    restart: unless-stopped
    ports:
      - "4017:4017"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}?currentSchema=invoice
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - gt-store-network

  # ----------------------------------------------------------------------------
  # Observability & Tracing (Phase 3)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: gt-store-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - gtstore_prometheus_data:/prometheus
    networks:
      - gt-store-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: gt-store-zipkin
    restart: unless-stopped
    ports:
      - "4012:9411"
    networks:
      - gt-store-network

  loki:
    image: grafana/loki:latest
    container_name: gt-store-loki
    user: root
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - gtstore_loki_data:/tmp/loki
    networks:
      - gt-store-network

  promtail:
    image: grafana/promtail:latest
    container_name: gt-store-promtail
    restart: unless-stopped
    depends_on:
      - kafka
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - gt-store-network

  grafana:
    image: grafana/grafana:latest
    container_name: gt-store-grafana
    restart: unless-stopped
    ports:
      - "4013:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT}
      - GF_SMTP_USER=${SMTP_USERNAME}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}
      - GF_SMTP_FROM_NAME=GT Store Observability
    depends_on:
      - prometheus
      - loki
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - gtstore_grafana_data:/var/lib/grafana
    networks:
      - gt-store-network
  # ----------------------------------------------------------------------------
  # Production Reverse Proxy (Phase 3)
  # # ----------------------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: gt-store-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/certs:/etc/nginx/certs
  #   depends_on:
  #     - api-gateway
  #     - gt-store-web
  #     - gt-store-admin-web
  #   networks:
  #     - gt-store-network

  # ----------------------------------------------------------------------------
  # Load Testing (k6)
  # ----------------------------------------------------------------------------
  k6:
    image: grafana/k6:latest
    container_name: gt-store-k6
    volumes:
      - ./tests/load:/scripts
    # For one-off runs: docker compose run --rm k6 run /scripts/load-test.js
    command: run /scripts/load-test.js
    networks:
      - gt-store-network
    depends_on:
      - api-gateway

networks:
  gt-store-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  gtstore_zookeeper_data:
  gtstore_zookeeper_log:
  gtstore_kafka_data:
  gtstore_elasticsearch_data:
  media_data:
  gtstore_prometheus_data:
  gtstore_loki_data:
  gtstore_grafana_data:

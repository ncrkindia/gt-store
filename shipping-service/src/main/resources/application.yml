server:
  port: 4016

spring:
  application:
    name: shipping-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/gtstore_db?currentSchema=shipping}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shipping-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serialization.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.gtstore.shippingservice.dto.OrderEvent

# Shiprocket custom configuration mapping to environment secrets
shiprocket:
  api-base-url: https://apiv2.shiprocket.in
  email: ${SHIPROCKET_EMAIL:dummy@example.com}
  password: ${SHIPROCKET_PASSWORD:dummy_password}
  pickup-location: ${SHIPROCKET_PICKUP_LOCATION:Primary Warehouse}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always

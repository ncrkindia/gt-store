# GT Store Metrics Configuration (Prometheus)
# Aggregates metrics from all microservices via their Spring Boot Actuator endpoints.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'search-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'search-service:4011'
  - job_name: 'gt-store-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'api-gateway:4003'
        - 'user-service:4004'
        - 'product-service:4005'
        - 'cart-service:4006'
        - 'order-service:4007'
        - 'inventory-service:4008'
        - 'payment-service:4009'
        - 'notification-service:4010'

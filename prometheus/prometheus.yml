# GT Store Metrics Configuration (Prometheus)
# Aggregates metrics from all microservices via their Spring Boot Actuator endpoints.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'search-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'search-service:8088'
  - job_name: 'gt-store-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'api-gateway:8081'
        - 'user-service:8082'
        - 'product-service:8083'
        - 'cart-service:8084'
        - 'order-service:8085'
        - 'inventory-service:8086'
        - 'payment-service:8087'
        - 'notification-service:8088'
